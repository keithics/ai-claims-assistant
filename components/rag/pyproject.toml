[project]
name = "rag"
version = "0.1.0"
description = "Kalayaan Mutual claims assistant: retrieval, ingestion and policy documents"
requires-python = ">=3.12"
dependencies = [
  "azure-identity>=1.17",
  "azure-search-documents>=11.6",
  "openai>=1.50",
  "pyyaml>=6",
  "country_packs",
  "shared",
  "telemetry",
]

[tool.uv.sources]
shared = { workspace = true }
telemetry = { workspace = true }
country_packs = { workspace = true }

[project.scripts]
ingest = "rag.ingest:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]
