[project]
name = "country_packs"
version = "0.1.0"
description = "Kalayaan Mutual claims assistant: country packs and model catalog"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "pyyaml>=6",
  "shared",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/country_packs"]
