[project]
name = "budget_controller"
version = "0.1.0"
description = "Kalayaan Mutual claims assistant: budget_controller"
requires-python = ">=3.12"
dependencies = [
  "azure-functions>=1.20",
  "azure-identity>=1.17",
  "azure-monitor-query>=1.4",
  "azure-storage-blob>=12.22",
  "country_packs",
  "shared",
  "telemetry",
]

[tool.uv.sources]
country_packs = { workspace = true }
shared = { workspace = true }
telemetry = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/budget_controller"]
