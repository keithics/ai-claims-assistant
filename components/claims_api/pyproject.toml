[project]
name = "claims_api"
version = "0.1.0"
description = "Kalayaan Mutual claims assistant: mock legacy claims system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "shared",
  "uvicorn>=0.30",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claims_api"]
