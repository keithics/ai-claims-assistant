name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"
      - "components/gateway/**"
      - "components/telemetry/workbook/**"

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_VAR_budget_alert_emails: ${{ vars.BUDGET_ALERT_EMAILS }}
    steps:
      - name: check Azure credentials
        id: creds
        run: |
          if [ -n "$ARM_CLIENT_ID" ] && [ -n "$ARM_TENANT_ID" ] && [ -n "$ARM_SUBSCRIPTION_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Azure credentials (AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID) are not configured, skipping terraform plan."
          fi
      - uses: actions/checkout@v4
        if: steps.creds.outputs.configured == 'true'
      - uses: hashicorp/setup-terraform@v3
        if: steps.creds.outputs.configured == 'true'
      - uses: azure/login@v2
        if: steps.creds.outputs.configured == 'true'
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: terraform plan (dev)
        if: steps.creds.outputs.configured == 'true'
        run: make plan ENV=dev
